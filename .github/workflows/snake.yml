name: Generate snake animation

on:
  schedule: # execute every 3 hours
    - cron: "0 */3 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

concurrency:
  group: persona-contribution-refresh
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build the Persona activity card
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_activity_svg.py

      - name: Build the Persona contribution trail
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_contribution_svg.py

      - name: Refresh README asset versions and commit
        run: |
          VERSION=$(cat assets/persona-contributions.svg assets/persona-activity.svg | sha256sum | cut -c1-12)
          sed -i -E "s#(assets/persona-(contributions|activity)\.svg)(\?v=[^\"' )]*)?#\1?v=${VERSION}#g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/persona-contributions.svg assets/persona-activity.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Persona contribution card [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
