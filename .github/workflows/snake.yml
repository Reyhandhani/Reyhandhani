name: Generate snake animation

on:
  schedule: # 00:00 and 12:00 WIB (UTC+7)
    - cron: "0 17 * * *"
    - cron: "0 5 * * *"

  workflow_dispatch:

  push:
    branches:
    - main

concurrency:
  group: persona-contribution-refresh
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out the profile
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate snake animation from the full contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npx --yes generate-snake-animation@3.5.0 --github_user=${{ github.repository_owner }} --output="dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#e6162c&color_dots=#161b22,#3b1117,#711420,#a91628,#e6162c"

      - name: Style the Persona contribution card
        run: python3 scripts/style_persona_snake.py --source dist/github-contribution-grid-snake-dark.svg --output assets/persona-contributions.svg

      - name: Build the Persona streak card
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/build_streak_svg.py

      - name: Refresh README asset versions and commit
        run: |
          VERSION=$(cat assets/persona-contributions.svg assets/persona-streak.svg | sha256sum | cut -c1-12)
          sed -i -E "s#(assets/persona-(contributions|streak)\.svg)(\?v=[^\"' )]*)?#\1?v=${VERSION}#g" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/persona-contributions.svg assets/persona-streak.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Refresh Persona contribution card [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
